{% extends "base.html" %} {% block content %}
<div id="reports-view">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-4xl">Reports & Exports</h2>
        <div class="flex gap-4">
            <button onclick="Reports.exportJSON()" class="btn btn-secondary">Export JSON</button>
            <button onclick="Reports.exportPDF()" class="btn btn-primary">Download PDF Report</button>
        </div>
    </div>
    <div class="glass-card mb-8">
        <h4 class="mb-6">Monthly Summary Table</h4>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="text-muted border-b border-glass">
                    <th>Date</th>
                    <th>kWh Used</th>
                    <th>Cost (₹)</th>
                    <th>CO2 (kg)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="report-table-body">
                <tr class="border-b border-glass hover:bg-glass">
                    <td class="py-4">Oct 24, 2023</td>
                    <td>18.4</td>
                    <td>₹2.39</td>
                    <td>7.1</td>
                    <td><span class="badge badge-low">Normal</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %} {% block extra_js %}
<script src="/static/js/reports.js"></script>{% endblock %}
